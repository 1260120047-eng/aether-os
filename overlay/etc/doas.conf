# Aether: wheel grubu yönetici komutlarını şifreyle çalıştırabilir
permit persist :wheel
# Ayarlar uygulamasının kullandığı yardımcılar şifre sormaz
permit nopass :wheel cmd /usr/bin/aether-eklenti
permit nopass :wheel cmd /usr/bin/aether-surucu
permit nopass :wheel cmd /usr/libexec/aether/saat-dilimi
