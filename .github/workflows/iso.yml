# Aether ISO'sunu her değişiklikte sıfırdan derler.
# - main dalına her gönderimde: ISO, işin "Artifacts" bölümünden indirilebilir (14 gün saklanır)
# - "1.1" gibi bir etiket (tag) gönderildiğinde: ISO o sürümün Releases sayfasına da eklenir
name: ISO

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: ISO derle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Alpine 3.22 derleme ortamı
        id: alpine
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.22

      - name: Klasörleri yerleştir
        shell: alpine.sh --root {0}
        run: |
          mkdir -p /work
          ln -sfn "${{ github.workspace }}/betikler" /s
          ln -sfn "${{ github.workspace }}/overlay" /work/overlay
          ln -sfn "${{ github.workspace }}/src" /work/src

      - name: Derleme araçları
        shell: alpine.sh --root {0}
        run: |
          sh /s/tools.sh
          sh /s/devtools.sh

      - name: Kök sistem
        shell: alpine.sh --root {0}
        run: sh /s/rootfs.sh

      - name: WebKit (Eclipse)
        shell: alpine.sh --root {0}
        run: sh /s/webkit.sh

      - name: ISO
        shell: alpine.sh --root {0}
        run: |
          sh /s/build.sh
          test -s /work/cikti/aether-1.0-nebula.iso
          cd /work/cikti && sha256sum aether-1.0-nebula.iso > aether-1.0-nebula.iso.sha256
          cat aether-1.0-nebula.iso.sha256

      - name: ISO'yu dışarı çıkar
        run: |
          mkdir -p cikti
          sudo cp "${{ steps.alpine.outputs.root-path }}"/work/cikti/aether-1.0-nebula.iso* cikti/
          sudo chown -R "$(id -u)" cikti
          ls -la cikti
          {
            echo "### Aether ISO"
            echo '```'
            cat cikti/aether-1.0-nebula.iso.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ISO'yu yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: aether-iso
          path: cikti/
          retention-days: 14
          compression-level: 0

      - name: Sürüme ekle (yalnızca etiketlerde)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cikti/*
