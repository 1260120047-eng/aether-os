# Aether: sanal makine ekran kartlarında OpenGL tabanlı 2B hızlandırmayı (glamor) kapat.
# VirtualBox VMSVGA + 3D gibi ortamlarda siyah ekranı önler; masaüstü için gerekmez.
Section "OutputClass"
    Identifier  "Aether sanal ekran"
    MatchDriver "vmwgfx|vboxvideo|virtio_gpu|qxl|bochs-drm|bochs|simpledrm"
    Driver      "modesetting"
    Option      "AccelMethod" "none"
EndSection
