# Aether ISO'sunu her değişiklikte sıfırdan derler.
# - main dalına her gönderimde: ISO, işin "Artifacts" bölümünden indirilebilir (14 gün saklanır)
# - "1.1" gibi bir etiket (tag) gönderildiğinde: ISO o sürümün Releases sayfasına da eklenir
name: ISO

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: ISO derle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Alpine 3.22 derleme ortamı
        run: |
          R="$HOME/alpine"
          M=https://dl-cdn.alpinelinux.org/alpine/v3.22
          F=$(curl -fsSL --retry 5 $M/releases/x86_64/latest-releases.yaml | awk '/file: alpine-minirootfs-.*x86_64.tar.gz/{print $2; exit}')
          echo "minirootfs: $F"
          mkdir -p "$R"
          curl -fsSL --retry 5 "$M/releases/x86_64/$F" | sudo tar xz -C "$R"
          printf '%s\n' "$M/main" "$M/community" | sudo tee "$R/etc/apk/repositories" >/dev/null
          sudo cp /etc/resolv.conf "$R/etc/resolv.conf"
          for m in proc sys dev dev/pts; do sudo mkdir -p "$R/$m"; sudo mount --bind "/$m" "$R/$m"; done
          sudo mkdir -p "$R/repo" "$R/work"
          sudo mount --bind "$GITHUB_WORKSPACE" "$R/repo"
          sudo ln -sfn /repo/betikler "$R/s"
          sudo ln -sfn /repo/overlay "$R/work/overlay"
          sudo ln -sfn /repo/src "$R/work/src"
          echo "ALPINE=$R" >> "$GITHUB_ENV"

      - name: Derleme araçları
        run: sudo chroot "$ALPINE" /bin/sh -c 'apk update -q && sh /s/tools.sh && sh /s/devtools.sh'

      - name: Kök sistem
        run: sudo chroot "$ALPINE" /bin/sh /s/rootfs.sh

      - name: WebKit (Eclipse)
        run: sudo chroot "$ALPINE" /bin/sh /s/webkit.sh

      - name: ISO
        run: |
          sudo chroot "$ALPINE" /bin/sh -c 'sh /s/build.sh && test -s /work/cikti/aether-1.1-nebula.iso && cd /work/cikti && sha256sum aether-1.1-nebula.iso > aether-1.1-nebula.iso.sha256'
          cat "$ALPINE/work/cikti/aether-1.1-nebula.iso.sha256"

      - name: ISO'yu dışarı çıkar
        run: |
          mkdir -p cikti
          sudo cp "$ALPINE"/work/cikti/aether-1.1-nebula.iso* cikti/
          sudo chown -R "$(id -u)" cikti
          ls -la cikti
          {
            echo "### Aether ISO"
            echo '```'
            cat cikti/aether-1.1-nebula.iso.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ISO'yu yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: aether-iso
          path: cikti/
          retention-days: 14
          compression-level: 0

      - name: Sürüme ekle (yalnızca etiketlerde)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cikti/*
